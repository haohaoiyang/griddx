services:
  model-api:
    build:
      context: ..
      dockerfile: api_service/Dockerfile
      args:
        PYTORCH_VERSION: ${PYTORCH_VERSION:-2.11.0}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: power-grid-model-api:${IMAGE_TAG:-1.0.0-cpu}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./runtime:/app/api_service/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  data-worker:
    image: power-grid-model-api:${IMAGE_TAG:-1.0.0-cpu}
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - .env
    command: ["python", "-m", "api_service.worker"]
    volumes:
      - ./runtime:/app/api_service/runtime
